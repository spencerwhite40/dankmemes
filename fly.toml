# Fly.io config for the PROCESSING machine (runner only, no web server).
# First time:   fly launch --no-deploy --copy-config --name <your-app-name>
# Secrets (type these yourself, never in chat or in git). This machine needs the database, the AI keys and the file storage:
#   fly secrets set DATABASE_URL=... GOOGLE_API_KEY=... ANTHROPIC_API_KEY=... OPENAI_API_KEY=... \
#     R2_ACCOUNT_ID=... R2_ACCESS_KEY_ID=... R2_SECRET_ACCESS_KEY=... R2_BUCKET=...
# (ANTHROPIC_API_KEY and OPENAI_API_KEY are optional: with only GOOGLE_API_KEY, Gemini watches the video and writes the captions.)
# It does not need the Stripe, email or legal settings: only the web app sends email and talks to Stripe.
# Full order of steps: docs/deploy.md
# Deploy:       fly deploy
# On the web app set MEME_BUILDER_RUNNER=off so only this machine processes jobs.
app = "dankmemes-worker"
primary_region = "iad"          # pick the region closest to your database

[build]
  dockerfile = "Dockerfile"

[processes]
  worker = "npm run worker"

[[vm]]
  processes = ["worker"]
  size = "performance-2x"       # video encoding is CPU-bound; shared cores are slow for this
  memory = "4gb"
