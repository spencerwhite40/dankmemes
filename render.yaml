# Render blueprint for the WEB app (pages + API). The processing machine is separate: see fly.toml and docs/deploy.md.
# Secrets are marked `sync: false`: Render asks for them in its dashboard, so they are typed there and never live in git.
# Check this file against Render's current blueprint format on the first deploy (docs/deploy.md has the steps).
services:
  - type: web
    name: dankmemes
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: MEME_BUILDER_RUNNER
        value: "off"                     # the Fly machine does the processing, not the web app
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true              # a long random string, made by Render
      - key: APP_URL
        sync: false                      # https://your-domain
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: COPYRIGHT_EMAIL
        sync: false
      - key: LEGAL_JURISDICTION
        sync: false
      - key: LEGAL_REVIEWED
        sync: false                      # "yes" once a lawyer has reviewed the legal pages; leave blank until then
      - key: ALERT_WEBHOOK_URL
        sync: false                      # optional: a Slack or Discord incoming webhook
      # Stripe price ids, one per plan and period and one per top-up pack (docs/billing.md):
      - key: STRIPE_PRICE_STARTER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STARTER_ANNUAL
        sync: false
      - key: STRIPE_PRICE_CREATOR_MONTHLY
        sync: false
      - key: STRIPE_PRICE_CREATOR_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_AGENCY_MONTHLY
        sync: false
      - key: STRIPE_PRICE_AGENCY_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PACK_MINI
        sync: false
      - key: STRIPE_PRICE_PACK_SMALL
        sync: false
      - key: STRIPE_PRICE_PACK_MEDIUM
        sync: false
      - key: STRIPE_PRICE_PACK_LARGE
        sync: false
      - key: STRIPE_PRICE_PACK_BULK
        sync: false
